[project]
name = "meadow-bridge"
version = "0.4.1"
description = "Authenticated Meadow integration with the GitHub Copilot native IDE interface"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.135.0",
    "uvicorn~=0.44.0",
    "pydantic>=2.4.0",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.0.0,<6.156",
    "pytest>=9.0.0",
    "pytest-xdist",
    "pytest-asyncio>=1.3.0",
    "httpx>=0.28.0",
    "mypy>=2.3",
    "pyrefly>=1.2.0",
    "ruff",
]

[project.scripts]
meadow-bridge = "meadow_bridge.__main__:main"

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "$MYPY_CONFIG_FILE_DIR/src"

[tool.pyrefly]
preset = "legacy"
python-version = "3.11"
search-path = ["src", "."]

[tool.pyrefly.errors]
no-any-return = "error"
redundant-cast = "warn"

[tool.ruff]
target-version = "py311"
extend-exclude = [".agents", ".codex", ".meadow", "tmp"]

[tool.ruff.lint]
# Match Meadow's explicit rule set rather than changing with Ruff defaults.
select = ["E4", "E7", "E9", "F"]

[tool.uv]
package = true
