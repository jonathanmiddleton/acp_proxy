[project]
name = "acp-proxy"
version = "0.2.0"
description = "Explicit Meadow-direct and deprecated OpenCode ACP proxy"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.135.0",
    "uvicorn~=0.44.0",
    "pydantic>=2.4.0",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.0.0,<6.156",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "httpx>=0.28.0",
]

[project.scripts]
acp-proxy = "acp_proxy.__main__:main"

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
pythonpath = ["src"]
